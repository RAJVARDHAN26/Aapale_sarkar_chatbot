<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aaple Sarkar Chatbot</title>
    <style>
        :root {
            --primary-color: #1a5276;
            --secondary-color: #2980b9;
            --accent-color: #e67e22;
            --light-color: #f9f9f9;
            --dark-color: #2c3e50;
            --success-color: #27ae60;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8eb 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #chatbox {
            background: #fff;
            border-radius: 15px;
            padding: 25px;
            width: 100%;
            max-width: 600px;
            margin: auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border: 1px solid #e0e0e0;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            color: var(--primary-color);
            position: relative;
        }

        .header h2 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }

        .header::after {
            content: "";
            display: block;
            width: 60px;
            height: 4px;
            background: var(--accent-color);
            margin: 10px auto 0;
            border-radius: 2px;
        }

        #messages {
            height: 400px;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #eee;
            border-radius: 8px;
            background: #fafafa;
            scrollbar-width: thin;
            scrollbar-color: var(--secondary-color) #f1f1f1;
        }

        #messages::-webkit-scrollbar {
            width: 6px;
        }

        #messages::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        #messages::-webkit-scrollbar-thumb {
            background-color: var(--secondary-color);
            border-radius: 6px;
        }

        .message {
            margin: 12px 0;
            padding: 10px 15px;
            border-radius: 18px;
            max-width: 80%;
            word-wrap: break-word;
            line-height: 1.4;
            position: relative;
        }

        .user {
            background: var(--primary-color);
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 5px;
        }

        .bot {
            background: #e8f4fc;
            color: var(--dark-color);
            margin-right: auto;
            border-bottom-left-radius: 5px;
            border: 1px solid #d0e3f1;
        }

        .input-container {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        #userInput {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            transition: border 0.3s;
        }

        #userInput:focus {
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 2px rgba(41, 128, 185, 0.2);
        }

        #langSelector {
            padding: 10px;
            border-radius: 25px;
            border: 1px solid #ddd;
            background: white;
            cursor: pointer;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            background: var(--secondary-color);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:hover {
            background: var(--primary-color);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        .voice-btn {
            width: 45px;
            height: 45px;
            padding: 0;
            border-radius: 50%;
            background: var(--accent-color);
        }

        .voice-btn:hover {
            background: #d35400;
        }

        .info-text {
            text-align: center;
            font-size: 13px;
            color: #666;
            margin-top: 15px;
        }

        .typing-indicator {
            display: inline-block;
            padding: 10px 15px;
            background: #e8f4fc;
            border-radius: 18px;
            color: var(--dark-color);
            border-bottom-left-radius: 5px;
            border: 1px solid #d0e3f1;
        }

        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--secondary-color);
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-5px); }
        }

        .logo {
            height: 40px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <div id="chatbox">
        <div class="header">
            <img src="../static/images/logo.png" alt="Aaple Sarkar Logo" class="logo">
            <h2>Aaple Sarkar Virtual Seva Kendra</h2>
            <p style="color: #555; font-size: 14px; margin-top: 5px;">Get government services without visiting CSC centers</p>
        </div>
        
        <div id="messages">
            <div class="message bot">
                Welcome to Aaple Sarkar Virtual Seva Kendra! How can I assist you with government services today?
            </div>
        </div>
        
        <div class="input-container">
            <input type="text" id="userInput" placeholder="Type your query about government services..." autocomplete="off">
            <select id="langSelector">
                <option value="auto">Auto</option>
                <option value="en-IN">English</option>
                <option value="mr-IN">Marathi</option>
                <option value="hi-IN">Hindi</option>
            </select>
            <button class="voice-btn" onclick="startListening()">🎤</button>
            <button onclick="sendMessage()">Send</button>
        </div>
        
        <p class="info-text">
            Ask about services like ration cards, certificates, pensions, licenses and more
        </p>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById("userInput");
            const message = input.value.trim();
            if (!message) return;

            addMessage(message, "user");
            input.value = "";
            
            // Show typing indicator
            const typingIndicator = document.createElement("div");
            typingIndicator.className = "message bot typing-indicator";
            typingIndicator.innerHTML = '<span></span><span></span><span></span>';
            document.getElementById("messages").appendChild(typingIndicator);
            document.getElementById("messages").scrollTop = document.getElementById("messages").scrollHeight;

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: message })
                });

                // Remove typing indicator
                document.getElementById("messages").removeChild(typingIndicator);

                if (!response.ok) throw new Error("Network response was not ok");
                
                const data = await response.json();
                addMessage(data.response, "bot");
                speak(data.response, data.lang);
            } catch (error) {
                document.getElementById("messages").removeChild(typingIndicator);
                addMessage("Sorry, there was an error processing your request. Please try again later.", "bot");
                console.error("Error:", error);
            }
        }

        function addMessage(text, className) {
            const messagesDiv = document.getElementById("messages");
            const msg = document.createElement("div");
            msg.className = `message ${className}`;
            msg.textContent = text;
            messagesDiv.appendChild(msg);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function startListening() {
            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            const selectedLang = document.getElementById("langSelector").value;

            recognition.lang = selectedLang !== 'auto' ? selectedLang : 'en-IN';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                document.getElementById("userInput").value = transcript;
            };

            recognition.onerror = function(event) {
                console.error("Voice recognition error", event.error);
                addMessage("Voice input error: " + event.error, "bot");
            };

            recognition.onend = function() {
                // Auto-send if there was input
                if (document.getElementById("userInput").value.trim()) {
                    sendMessage();
                }
            };

            recognition.start();
            addMessage("Listening... Speak now", "bot");
        }

        function speak(text, langCode) {
            if (!text) return;
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = langCode === 'mr' ? 'mr-IN' : 
                            langCode === 'hi' ? 'hi-IN' : 'en-IN';
            
            // Set a pleasant voice and rate
            utterance.rate = 0.9;
            utterance.pitch = 1;
            
            window.speechSynthesis.speak(utterance);
        }

        // Allow sending message with Enter key
        document.getElementById("userInput").addEventListener("keypress", function(e) {
            if (e.key === "Enter") {
                sendMessage();
            }
        });
    </script>
</body>

</html>
